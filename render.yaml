services:
  - type: web
    name: lex-company-counsel
    runtime: node
    plan: free
    region: virginia
    branch: feat/complete-product
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm db:deploy:preview && pnpm --filter @lex/web start
    envVars:
      - key: APP_ENV
        value: preview
      - key: DATABASE_URL
        fromDatabase:
          name: lex-company-counsel-preview
          property: connectionString
      - key: LEX_APP_PASSWORD
        generateValue: true
      - key: LLM_PROVIDER
        value: none
